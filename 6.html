
<section class="contact">
    <div class="contact-container">
        
        
        <div class="contact-content">
            <h2 class="contact-title">Ваша свадьба<br>начинается с вас.</h2>
            <p class="contact-desc">А мы поможем собрать всё остальное.<br>Создайте свой план и готовьтесь без спешки.</p>
        </div>

       
        <div class="contact-form-wrapper">
            <div class="contact-card">
                <h3 class="form-title">Давайте знакомиться</h3>
                
                <form action="#" class="form">
                    <div class="form-group">
                        <label for="name" class="form-label">Как вас зовут</label>
                        <input type="text" id="name" class="form-input" placeholder="Ваше имя" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Электронная почта</label>
                        <input type="email" id="email" class="form-input" placeholder="you@example.ru" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Создать план свадьбы</button>
                    
                    <p class="form-disclaimer">
                        Нажимая кнопку, вы соглашаетесь с <a href="#">условиями сервиса</a> и <a href="#">политикой обработки персональных данных</a>.
                    </p>
                </form>
            </div>
        </div>

    </div>
</section>
